default: &default
  default_provider: meta
  validate_signatures: true
  # Outbound provider overrides by destination phone (E.164, without "whatsapp:" prefix).
  # Example:
  #   "+573001112233": twilio
  phone_overrides: {}
  # Outbound provider overrides by business id (string keys).
  # Example:
  #   "12": twilio
  business_overrides: {}
  agent:
    # Global default when a business has whatsapp_agent=inherit (2)
    default: regex
    llm_provider: openai # openai | fake
    model: gpt-4o-mini
    temperature: 0
    confidence_threshold: 0.7
  media:
    audio_enabled: true
    image_enabled: false # multimodal in a follow-up PR
    max_bytes: 16777216 # 16 MB
    whisper_model: whisper-1
    transcriber: openai # openai | fake

development:
  <<: *default
  validate_signatures: false
  agent:
    default: regex
    llm_provider: fake
    model: gpt-4o-mini
    temperature: 0
    confidence_threshold: 0.7
  media:
    audio_enabled: true
    image_enabled: false
    max_bytes: 16777216
    whisper_model: whisper-1
    transcriber: fake

test:
  <<: *default
  default_provider: test
  validate_signatures: false
  agent:
    default: regex
    llm_provider: fake
    model: gpt-4o-mini
    temperature: 0
    confidence_threshold: 0.7
  media:
    audio_enabled: true
    image_enabled: false
    max_bytes: 16777216
    whisper_model: whisper-1
    transcriber: fake

production:
  <<: *default
