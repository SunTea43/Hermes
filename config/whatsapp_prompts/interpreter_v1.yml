schema:
  type: object
  additionalProperties: false
  properties:
    intent:
      type: string
      enum:
        - sale
        - purchase
        - payment
        - inventory_query
        - report
        - unknown
        - clarify
    entities:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              product_name:
                type: ["string", "null"]
              quantity:
                type: ["number", "null"]
              unit:
                type: ["string", "null"]
              unit_price:
                type: ["number", "null"]
            required:
              - product_name
              - quantity
              - unit
              - unit_price
        product_name:
          type: ["string", "null"]
        quantity:
          type: ["number", "null"]
        unit:
          type: ["string", "null"]
        unit_price:
          type: ["number", "null"]
        customer_name:
          type: ["string", "null"]
        supplier_name:
          type: ["string", "null"]
        payment_condition:
          type: ["string", "null"]
        amount:
          type: ["number", "null"]
      required:
        - items
        - product_name
        - quantity
        - unit
        - unit_price
        - customer_name
        - supplier_name
        - payment_condition
        - amount
    confidence:
      type: number
      minimum: 0
      maximum: 1
  required:
    - intent
    - entities
    - confidence
